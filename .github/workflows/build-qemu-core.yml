name: Build QEMU Core
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned UTM QEMU iOS core
        run: chmod +x scripts/*.sh && ./scripts/build-qemu-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: QEMUCore-utm-v5.0.3-ios-x86_64
          path: |
            dist/QEMUCore-utm-v5.0.3-ios-x86_64.zip
            dist/QEMUCore-utm-v5.0.3-ios-x86_64.sha256
          retention-days: 30
      - name: Publish core prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qemu-core-v5.0.3
          target_commitish: ${{ github.sha }}
          name: DroidBox QEMU Core (UTM v5.0.3)
          body: Pinned iOS QEMU x86_64 framework and dependency closure extracted from the official UTM v5.0.3 release. Licenses are included.
          prerelease: true
          files: |
            dist/QEMUCore-utm-v5.0.3-ios-x86_64.zip
            dist/QEMUCore-utm-v5.0.3-ios-x86_64.sha256
