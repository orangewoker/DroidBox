name: Build Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main, ios]
  pull_request:
permissions:
  contents: write
concurrency:
  group: droidbox-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Prepare Ren'Py 8.4.1 iOS runtime
        run: chmod +x scripts/*.sh && ./scripts/prepare-renpy-runtime.sh
      - name: Compile app and unit tests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next((x["udid"] for xs in d.values() for x in xs if x["name"].startswith("iPhone")), ""))')"
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print(next(x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone")))')"
            RUNTIME="$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; xs=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS"]; print(xs[-1]["identifier"])')"
            DEVICE_ID="$(xcrun simctl create DroidBox-CI "$DEVICE_TYPE" "$RUNTIME")"
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project DroidBox.xcodeproj -scheme DroidBox -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Build unsigned IPA
        run: chmod +x scripts/*.sh && ./scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DroidBox-unsigned-ipa
          path: dist/*
      - name: Read version
        id: version
        run: echo "version=$(grep MARKETING_VERSION Config/Base.xcconfig | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Publish prerelease
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DroidBox iOS ${{ steps.version.outputs.version }}
          body: Unsigned DroidBox IPA for LiveContainer or local re-signing.
          prerelease: true
          files: |
            dist/DroidBox-unsigned.ipa
            dist/DroidBox-${{ steps.version.outputs.version }}-unsigned.ipa
            dist/DroidBox-unsigned.sha256
            dist/build-info.json
