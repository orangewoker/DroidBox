<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>html,body{margin:0;background:#111;color:#fff;font-family:system-ui;height:100%;display:grid;place-items:center}canvas{max-width:100%;touch-action:none}</style></head><body><canvas id="game" width="640" height="360"></canvas><script>const c=document.querySelector('#game'),x=c.getContext('2d');let n=+(localStorage.droidboxSmoke||0);function draw(px=320,py=180){x.fillStyle='#17201d';x.fillRect(0,0,640,360);x.fillStyle='#23a668';x.fillRect(px-30,py-30,60,60);x.fillStyle='white';x.fillText('DroidBox Web Smoke - touches '+n,20,30)}c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();n++;localStorage.droidboxSmoke=n;draw((e.clientX-r.left)*640/r.width,(e.clientY-r.top)*360/r.height)});draw()</script></body></html>
